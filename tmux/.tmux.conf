set -g status-style bg=default
set -g status-style fg=default
set -g status on
set -g status-left-style bright
set -g status-left "  #[fg=colour14]#[bg=default]#[fg=colour0]#[bg=colour14]"
set -g status-right "#[fg=red]  | #[fg=default]#{?window_zoomed_flag, #[fg=white#,bg=red] Fullscreen #[fg=default#,bg=default],}#{?client_prefix,#[bg=colour254]#[fg=colour0] #S , #S }"
set -g status-left-length 40
set -g status-justify right

set -g pane-border-status off

# customize how windows are displayed in the status line
set -g window-status-current-format "#[fg=colour4]#[bg=default]#[fg=colour0]#[bg=colour4]#[fg=colour7]#[bg=default] ✔ #[fg=colour7]#{b:pane_current_path} #[fg=colour4]#[bg=colour0]"
set -g window-status-format "#[fg=colour0]#[bg=default]#[fg=colour247]#[bg=colour0] #I#[fg=colour244] #{b:pane_current_path} "

# Pane colors
set -g pane-active-border-style bg=default,fg=colour255,bold
set -g pane-border-style fg=colour238
set -g pane-border-indicators colour

# Enable mouse scrolling (enters copy mode automatically)
set -g mouse on

# fn+arrow up/down (Page Up/Down) to scroll tmux's scrollback.
# PageUp enters copy-mode and pages up into history.
# PageDown pages down while in copy-mode; otherwise forwards to the app
# (there's nothing below the live prompt to scroll to in normal mode).
bind -n PageUp copy-mode -eu
bind -n PageDown if-shell -F '#{pane_in_mode}' 'send-keys -X page-down' 'send-keys PageDown'

# Pane navigation - vim-style with prefix key
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation - arrow keys with prefix key
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# Optional: Root-level pane navigation (no prefix needed)
# Uncomment these if you want Ctrl+Arrow keys to work without prefix
# bind -n C-Left select-pane -L
# bind -n C-Down select-pane -D
# bind -n C-Up select-pane -U
# bind -n C-Right select-pane -R

# Window navigation - switch to previous/next window
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# New windows/panes inherit current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

 
# Clipboard (OSC 52) handling: let apps copy through tmux to the terminal,
# and avoid split escape sequences leaking into the input as stray base64.
set -g set-clipboard on
set -g allow-passthrough on
set -sg escape-time 10
